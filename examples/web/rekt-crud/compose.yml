services:
  koutendb:
    build:
      context: ../../..
      dockerfile: examples/compose/Dockerfile
    command:
      - --id=0
      - --peers=0.0.0.0:7301
      - --data=/data/rekt
      - --disk-backed
      - --slow-tick=0.05
      - --galaxy=rekt-demo
      - --user=demo
    environment:
      KOUTEN_PASSWORD: ${KOUTEN_PASSWORD:-demo-password}
      KOUTEN_SECRET_KEY: ${KOUTEN_SECRET_KEY:-demo-secret-key}
    volumes:
      - rekt_data:/data
    healthcheck:
      test: ["CMD-SHELL", "koutencli health --peers=127.0.0.1:7301 --galaxy=rekt-demo --user=demo --password=$${KOUTEN_PASSWORD:-demo-password} --secret-key=$${KOUTEN_SECRET_KEY:-demo-secret-key} >/dev/null"]
      interval: 3s
      timeout: 2s
      retries: 20

  api:
    build:
      context: ../../..
      dockerfile: examples/web/rekt-crud/api/Dockerfile
    environment:
      KOUTEN_PEERS: koutendb:7301
      KOUTEN_USER: demo
      KOUTEN_PASSWORD: ${KOUTEN_PASSWORD:-demo-password}
      KOUTEN_SECRET_KEY: ${KOUTEN_SECRET_KEY:-demo-secret-key}
      KOUTEN_GALAXY: rekt-demo
      KOUTEN_RING: demo/tasks
    depends_on:
      koutendb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 20

  web:
    build:
      context: ./web
    ports:
      - "${REKT_PORT:-18080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 3s
      timeout: 2s
      retries: 20

  smoke:
    build:
      context: ../../..
      dockerfile: examples/web/rekt-crud/tests/Dockerfile
    profiles: ["test"]
    environment:
      BASE_URL: http://web:8080/api
    depends_on:
      web:
        condition: service_healthy

volumes:
  rekt_data:
