name: CI

on:
  pull_request:
    branches:
      - devel
      - main
  push:
    branches:
      - devel
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify_flow:
    name: Classify protected branch flow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test branch flow classification
        run: sh tools/ci/branch_flow.sh self-test

      - name: Classify this workflow run
        id: classify
        env:
          KOUTEN_EVENT_NAME: ${{ github.event_name }}
          KOUTEN_BASE_REF: ${{ github.base_ref }}
          KOUTEN_HEAD_REF: ${{ github.head_ref }}
          KOUTEN_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          KOUTEN_REPOSITORY: ${{ github.repository }}
        run: |
          mode=$(sh tools/ci/branch_flow.sh classify \
            "$KOUTEN_EVENT_NAME" \
            "$KOUTEN_BASE_REF" \
            "$KOUTEN_HEAD_REF" \
            "$KOUTEN_HEAD_REPOSITORY" \
            "$KOUTEN_REPOSITORY")
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "CI flow: $mode"

  checks:
    name: Nim checks and C ABI
    needs: classify_flow
    if: ${{ needs.classify_flow.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libssl-dev libsodium-dev openssl

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.10'

      - name: Install Nim dependencies
        run: nimble install -y --depsOnly

      - name: Nimble package check
        run: nimble check

      - name: Nim semantic checks
        run: |
          nim check src/koutendb.nim
          nim check src/koutencli.nim
          nim check src/koutend.nim
          nim check src/koutendb_capi.nim

      - name: Nim semantic checks with TLS enabled
        run: |
          nim check -d:ssl src/koutencli.nim
          nim check -d:ssl src/koutend.nim
          nim check -d:ssl src/koutendb_capi.nim

      - name: C ABI contract
        run: |
          KOUTENDB_CAPI_NIMCACHE=/tmp/nimcache_kouten_capi_ci scripts/build_capi.sh
          gcc examples/cabi_contract.c -Iinclude -Llib -lkoutendb -Wl,-rpath,'$ORIGIN/../lib' -o /tmp/kouten_cabi_contract
          LD_LIBRARY_PATH=lib /tmp/kouten_cabi_contract

      - name: C ABI TLS contract
        run: scripts/cabi_tls_smoke.sh

  capi-macos-build:
    name: C ABI TLS-enabled build on macOS
    needs: classify_flow
    if: ${{ needs.classify_flow.outputs.mode == 'full' }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: brew install libsodium openssl

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.10'

      - name: Install Nim dependencies
        run: nimble install -y --depsOnly

      - name: Build TLS-enabled C ABI library
        run: KOUTENDB_CAPI_NIMCACHE=/tmp/nimcache_kouten_capi_macos scripts/build_capi.sh

  core-tests:
    name: Core test suite
    needs: classify_flow
    if: ${{ needs.classify_flow.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libsodium-dev

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.10'

      - name: Install Nim dependencies
        run: nimble install -y --depsOnly

      - name: Run core tests
        run: scripts/test_core.sh

  smoke-tests:
    name: CLI, cluster, recovery, and universe smoke
    needs: classify_flow
    if: ${{ needs.classify_flow.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libsodium-dev

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.10'

      - name: Install Nim dependencies
        run: nimble install -y --depsOnly

      - name: Run CLI CRUD smoke
        run: scripts/cli_crud_smoke.sh

      - name: Run cluster transaction smoke
        run: scripts/cluster_tx_smoke.sh

      - name: Run cluster failure smoke
        run: scripts/cluster_failure_smoke.sh

      - name: Run cluster authorization smoke
        run: scripts/cluster_authz_smoke.sh

      - name: Run cluster RBAC smoke
        run: scripts/cluster_rbac_smoke.sh

      - name: Run cluster wire driver smoke
        run: scripts/cluster_wire_driver_smoke.sh

      - name: Run cluster retrieval routing smoke
        run: scripts/cluster_retrieve_routing_smoke.sh

      - name: Run cluster wire fuzz smoke
        run: scripts/cluster_wire_fuzz_smoke.sh

      - name: Run disk-backed server maintenance and pagination smoke
        run: scripts/auto_pack_server_smoke.sh

      - name: Run process crash publication matrix
        run: scripts/process_crash_matrix.sh

      - name: Run concurrency and backpressure matrix
        run: scripts/concurrency_backpressure_smoke.sh

      - name: Run storage failure matrix
        run: scripts/storage_failure_matrix.sh

      - name: Run recovery smoke
        run: scripts/recovery_smoke.sh

      - name: Run universe sync failure smoke
        run: scripts/universe_sync_failure_smoke.sh

      - name: Run universe remote sync smoke
        run: scripts/universe_sync_remote_smoke.sh

      - name: Run demo smoke matrix
        run: scripts/demo_smoke.sh

  tls-smoke:
    name: TLS transport smoke
    needs: classify_flow
    if: ${{ needs.classify_flow.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libssl-dev libsodium-dev openssl

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.10'

      - name: Install Nim dependencies
        run: nimble install -y --depsOnly

      - name: Run TLS smoke
        run: scripts/cluster_tls_smoke.sh

  required-gate:
    name: CI required gate
    if: ${{ always() }}
    needs:
      - classify_flow
      - checks
      - capi-macos-build
      - core-tests
      - smoke-tests
      - tls-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required result
        env:
          GH_TOKEN: ${{ github.token }}
          KOUTEN_FLOW_MODE: ${{ needs.classify_flow.outputs.mode }}
          KOUTEN_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          KOUTEN_REQUIRED_RESULTS: ${{ toJson(needs) }}
        run: |
          case "$KOUTEN_FLOW_MODE" in
            full)
              printf '%s' "$KOUTEN_REQUIRED_RESULTS" | \
                jq -e 'all(.[]; .result == "success")'
              ;;
            promotion)
              sh tools/ci/branch_flow.sh verify-promotion
              ;;
            *)
              echo "::error::This protected branch route is not allowed."
              exit 1
              ;;
          esac
